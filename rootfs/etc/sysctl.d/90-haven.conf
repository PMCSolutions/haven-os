# ===== Haven OS kernel tunables =====

# --- Gaming ---
# Many Windows games (and Proton titles like CS2, Hogwarts Legacy,
# Starfield) need a very high memory map count.
vm.max_map_count = 2147483642
# Keep the desktop responsive under memory pressure (zram is fast)
vm.swappiness = 100
vm.page-cluster = 0
# Split-lock mitigation causes stutter in some Windows games
kernel.split_lock_mitigate = 0

# --- Privacy / hardening ---
# Hide kernel pointers and logs from normal users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# Only parents may ptrace children (anti-cheat compatible)
kernel.yama.ptrace_scope = 1
# No unprivileged BPF; harden the JIT
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# No hot-swapping the kernel at runtime
kernel.kexec_load_disabled = 1
# Protect links and FIFOs in shared directories
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Do not write core dumps containing private memory
fs.suid_dumpable = 0

# --- Network privacy ---
# Use temporary, rotating IPv6 addresses instead of hardware-derived ones
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
# Network hardening
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Don't leak uptime via TCP timestamps
net.ipv4.tcp_timestamps = 0
