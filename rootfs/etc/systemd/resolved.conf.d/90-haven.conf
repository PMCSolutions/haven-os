# Haven OS: encrypted DNS by default (DNS-over-TLS, Quad9 — Swiss, no logging).
# Change provider in Haven Welcome, or run: sudo haven-settings dns <provider>
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=yes
DNSSEC=allow-downgrade
# No silent fallback to Google/Cloudflare
FallbackDNS=
Domains=~.
# Don't announce this machine on the local network
LLMNR=no
MulticastDNS=no
