# Haven OS network privacy

[main]
dns=systemd-resolved

[connectivity]
# No "phone home" connectivity checks
enabled=false

[device]
# Random MAC address while scanning for Wi-Fi
wifi.scan-rand-mac-address=yes

[connection]
# Each network sees a different (but stable) MAC address, so you can't be
# tracked between coffee shop, school and home. Captive portals still work.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# Rotating IPv6 privacy addresses
ipv6.ip6-privacy=2
# Don't broadcast your device name to DHCP servers
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
