title    Haven OS (safe graphics — use if the screen stays black)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-haven
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-haven.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset
