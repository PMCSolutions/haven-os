---
efiSystemPartition: "/boot"
efiSystemPartitionSize: 2GiB
efiSystemPartitionName: HAVEN_EFI

# Offer full-disk encryption on the "Erase disk" page (LUKS2).
# The bootloader lives on the unencrypted EFI partition, so LUKS2 + Argon2 works.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

userSwapChoices:
  - none
  - file
initialSwapChoice: none   # zram is used instead (see /etc/systemd/zram-generator.conf)

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
