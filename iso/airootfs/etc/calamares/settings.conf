---
# Haven OS installer (Calamares 3.3)
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: postinstall
    module: shellprocess
    config: shellprocess_postinstall.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@postinstall
      - initcpiocfg
      - initcpio
      - bootloader
      - umount
  - show:
      - finished

branding: haven
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
