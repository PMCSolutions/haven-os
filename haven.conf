# Haven OS — project configuration
# Edit these values, then run ./build.sh

OS_NAME="Haven OS"
OS_ID="haven"
OS_VERSION="0.1.4"
OS_CODENAME="Lighthouse"

# Kernel series to build. "auto" picks the newest kernel.org stable release
# that also has a matching BORE scheduler patch. Or pin e.g. "6.18".
KERNEL_SERIES="auto"

# Where installed systems fetch updates (kernel + Haven packages).
# The GitHub workflow publishes the repo as release assets, so this is usually:
#   https://github.com/<you>/haven-os/releases/download/repo
# Leave empty to build/use a local repo only.
HAVEN_REPO_URL="https://github.com/PMCSolutions/haven-os/releases/download/repo"

# Optional: GPG key ID used to sign packages and the repo database.
# Strongly recommended before you hand the OS to anyone else.
GPG_SIGN_KEY="${GPG_SIGN_KEY:-}"

# Default encrypted DNS provider (quad9 | mullvad | cloudflare | network)
DEFAULT_DNS="quad9"
